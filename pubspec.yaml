  output: lib/gen/
  line_length: 80

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/icon.jpg"
  adaptive_icon_background: "#2172cb"
  adaptive_icon_foreground: "assets/icon/icon.jpg"

# The following section is specific to Flutter packages.
flutter:
  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - .env.dev
    - .env.prod
    - assets/icons/
    - assets/animations/
    - assets/lotties/
    - assets/icons/empty.svg
    - assets/img/
    - assets/img/piece/
    - assets/img/onboarding/
    - assets/icon/
    - assets/icon/icon_large.png
    - assets/icon/marker.png
    - assets/icon/leading.json
    - assets/img/onboarding/
    - assets/img/panorama.jpg
    - assets/img/modal/
    - assets/gif/
    - assets/svgs/icons/
