name: Deploy iOS to TestFlight

on:
  push:
    branches:
      - test/develop
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environnement à déployer'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prod

jobs:
  build-and-deploy-ios:
    runs-on: macos-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v3

      - name: 🌍 Determine environment (flavor)
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            FLAVOR="${{ github.event.inputs.environment }}"
          else
            FLAVOR="dev"
          fi

          echo "FLAVOR=$FLAVOR" >> $GITHUB_ENV
          echo "➡️ Flavor utilisé : $FLAVOR"

      - name: 🔐 Install Apple Certificates and Provisioning Profiles
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.IOS_BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          EXTENSION_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_EXTENSION_PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          EXT_PP_PATH=$RUNNER_TEMP/build_ext_pp.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o $PP_PATH
          echo -n "$EXTENSION_PROVISION_PROFILE_BASE64" | base64 --decode -o $EXT_PP_PATH

          echo "🔍 Vérification de la taille des fichiers générés :"
          ls -lh $CERTIFICATE_PATH
          ls -lh $PP_PATH
          ls -lh $EXT_PP_PATH

          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles

          # Installation du profil principal
          UUID=$(grep UUID -A1 -a $PP_PATH | grep -io "[-A-F0-9]\{36\}")
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/$UUID.mobileprovision
          echo "PROFILE_UUID=$UUID" >> $GITHUB_ENV

          # Installation du profil de l'extension OneSignal
          EXT_UUID=$(grep UUID -A1 -a $EXT_PP_PATH | grep -io "[-A-F0-9]\{36\}")
          cp $EXT_PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/$EXT_UUID.mobileprovision
          echo "EXT_PROFILE_UUID=$EXT_UUID" >> $GITHUB_ENV

      - name: 🔧 Patch project.pbxproj (build settings réels, via xcodeproj)
        env:
          MAIN_UUID: ${{ env.PROFILE_UUID }}
          EXT_UUID: ${{ env.EXT_PROFILE_UUID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          gem install xcodeproj --no-document

          ruby -e '
            require "xcodeproj"

            project = Xcodeproj::Project.open("ios/Runner.xcodeproj")

            targets_map = {
              "Runner" => ENV["MAIN_UUID"],
              "OneSignalNotificationServiceExtension" => ENV["EXT_UUID"]
            }

            project.targets.each do |target|
              next unless targets_map.key?(target.name)
              uuid = targets_map[target.name]

              target.build_configurations.each do |config|
                next unless config.name == "Release"
                config.build_settings["CODE_SIGN_STYLE"] = "Manual"
                config.build_settings["CODE_SIGN_IDENTITY"] = "Apple Distribution"
                config.build_settings["PROVISIONING_PROFILE_SPECIFIER"] = uuid
                config.build_settings["DEVELOPMENT_TEAM"] = ENV["TEAM_ID"]
                puts "✅ #{target.name} (Release) -> profil #{uuid}"
              end
            end

            project.save
            puts "✅ project.pbxproj sauvegardé"
          '

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'
          channel: 'stable'
          cache: true

      - name: 🔍 Afficher versions Flutter/Dart
        run: |
          flutter --version
          dart --version
          echo "--- .fvmrc ---"
          cat .fvmrc || echo "(pas de .fvmrc)"

      - name: 🗄️ Cache Pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-

      - name: 🗄️ Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            ios/Pods
            ~/Library/Caches/CocoaPods
          key: pods-${{ runner.os }}-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: |
            pods-${{ runner.os }}-

      - name: 📦 Install Dependencies
        run: flutter pub get

      - name: 🔍 Versions résolues des packages de génération
        run: |
          grep -A3 -E "^  (analyzer|build_runner|freezed|json_serializable|retrofit_generator|source_gen):" pubspec.lock
          echo "--- sdks requis (pubspec.lock) ---"
          grep -A2 "^sdks:" pubspec.lock

      - name: 🗄️ Cache build_runner output
        uses: actions/cache@v4
        with:
          path: .dart_tool/build
          key: build-runner-${{ runner.os }}-${{ hashFiles('pubspec.lock', 'lib/**/*.dart') }}
          restore-keys: |
            build-runner-${{ runner.os }}-

      - name: ⚙️ Generate code (freezed / json_serializable)
        run: |
          set -o pipefail
          dart run build_runner build --delete-conflicting-outputs 2>&1 | tee build_runner.log

      - name: 📤 Uploader le log build_runner (si échec)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-runner-log-ios
          path: build_runner.log

      - name: 🔢 Compute build number (via App Store Connect API)
        env:
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
          IOS_BASE_BUILD_NUMBER: ${{ secrets.IOS_BASE_BUILD_NUMBER }}
        run: |
          gem install jwt --no-document

          MARKETING_VERSION=$(grep '^version:' pubspec.yaml | sed -E 's/^version:\s*([0-9]+\.[0-9]+\.[0-9]+)\+([0-9]+)/\1/')
          FALLBACK_BUILD="$IOS_BASE_BUILD_NUMBER"

          if [ -z "$MARKETING_VERSION" ]; then
            echo "❌ Impossible d'extraire la version depuis pubspec.yaml (format attendu: X.Y.Z+N)"
            exit 1
          fi

          if [ -z "$FALLBACK_BUILD" ]; then
            echo "❌ Secret IOS_BASE_BUILD_NUMBER manquant ou vide"
            exit 1
          fi

          NEW_BUILD=$(BUNDLE_ID="com.immoplus.ci" MARKETING_VERSION="$MARKETING_VERSION" FALLBACK_BASE="$FALLBACK_BUILD" ruby -e '
            require "jwt"
            require "openssl"
            require "net/http"
            require "json"
            require "time"

            private_key = OpenSSL::PKey.read(ENV.fetch("APPSTORE_PRIVATE_KEY"))

            token = JWT.encode(
              { iss: ENV.fetch("APPSTORE_ISSUER_ID"), exp: Time.now.to_i + 600, aud: "appstoreconnect-v1" },
              private_key,
              "ES256",
              { kid: ENV.fetch("APPSTORE_KEY_ID"), typ: "JWT" }
            )

            def api_get(path, token)
              uri = URI("https://api.appstoreconnect.apple.com#{path}")
              req = Net::HTTP::Get.new(uri)
              req["Authorization"] = "Bearer #{token}"
              res = Net::HTTP.start(uri.hostname, uri.port, use_ssl: true) { |http| http.request(req) }
              JSON.parse(res.body)
            end

            bundle_id = ENV.fetch("BUNDLE_ID")
            version = ENV.fetch("MARKETING_VERSION")

            apps = api_get("/v1/apps?filter[bundleId]=#{bundle_id}", token)
            app_id = apps.dig("data", 0, "id")
            raise "App introuvable pour bundleId=#{bundle_id}: #{apps}" unless app_id

            builds = api_get("/v1/builds?filter[app]=#{app_id}&sort=-version&limit=1", token)
            latest = builds.dig("data", 0, "attributes", "version")

            new_build = latest ? latest.to_i + 1 : ENV.fetch("FALLBACK_BASE").to_i
            puts new_build
          ')

          if [ -z "$NEW_BUILD" ]; then
            echo "❌ Échec du calcul du build number via App Store Connect API"
            exit 1
          fi

          echo "BUILD_NUMBER=$NEW_BUILD" >> $GITHUB_ENV
          echo "➡️ Build number utilisé : $NEW_BUILD (version=$MARKETING_VERSION, source=App Store Connect API, fallback pubspec=$FALLBACK_BUILD)"

      - name: 📄 Create ExportOptions.plist
        run: |
          cat <<EOF > ios/ExportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.immoplus.ci</key>
              <string>${{ env.PROFILE_UUID }}</string>
              <key>com.immoplus.ci.OneSignalNotificationServiceExtension</key>
              <string>${{ env.EXT_PROFILE_UUID }}</string>
            </dict>
            <key>signingCertificate</key>
            <string>Apple Distribution</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>uploadBitcode</key>
            <false/>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          EOF

      - name: 🔁 Mettre à jour les specs CocoaPods (évite le cache CDN périmé)
        run: pod repo update

      - name: 🔨 Build IPA
        run: |
          flutter build ipa --release --build-number ${{ env.BUILD_NUMBER }} --export-options-plist=ios/ExportOptions.plist

      - name: 🔍 Resolve IPA path
        id: ipa
        run: |
          IPA_PATH=$(find build/ios/ipa -name "*.ipa" | head -n 1)
          if [ -z "$IPA_PATH" ]; then
            echo "❌ Aucun fichier .ipa trouvé dans build/ios/ipa"
            exit 1
          fi
          echo "Fichier trouvé : $IPA_PATH"
          echo "path=$IPA_PATH" >> "$GITHUB_OUTPUT"

      - name: 🚀 Upload to TestFlight
        uses: apple-actions/upload-testflight-build@v1
        with:
          app-path: ${{ steps.ipa.outputs.path }}
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_PRIVATE_KEY }}

      - name: 🧹 Clean up keychain and profiles
        if: always()
        run: |
          security delete-keychain $RUNNER_TEMP/app-signing.keychain-db || true
          rm -f ~/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision